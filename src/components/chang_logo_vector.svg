<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%" fill="none">
  {/* Musical Stave Lines (خطوط ۵ گانه حامل موسیقی) */}
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.95">
    {/* Left Staves */}
    <line x1="30" y1="305" x2="215" y2="305" />
    <line x1="30" y1="335" x2="200" y2="335" />
    <line x1="30" y1="365" x2="195" y2="365" />
    <line x1="30" y1="395" x2="205" y2="395" />
    <line x1="30" y1="425" x2="215" y2="425" />

    {/* Center Underlying Baseline Connection */}
    <line x1="215" y1="425" x2="985" y2="425" stroke-width="5.5" />

    {/* Right Staves */}
    <line x1="775" y1="305" x2="1170" y2="305" />
    <line x1="790" y1="335" x2="1170" y2="335" />
    <line x1="815" y1="365" x2="1170" y2="365" />
    <line x1="840" y1="395" x2="1170" y2="395" />
    <line x1="860" y1="425" x2="1170" y2="425" />
  </g>

  {/* Left Eighth Note (نت چنگ چپ) */}
  <g fill="currentColor">
    {/* Notehead with slanted musical angle */}
    <ellipse cx="110" cy="385" rx="42" ry="27" transform="rotate(-28 110 385)" />
    {/* Note Stem */}
    <rect x="135" y="160" width="10.5" height="225" rx="5" />
    {/* Note Flag / Hook */}
    <path d="M145.5 160 C172 198, 208 238, 202 288 C197 308, 178 302, 172 278 C172 238, 155 195, 145.5 174 Z" />
  </g>

  {/* Right Eighth Note (نت چنگ راست) */}
  <g fill="currentColor">
    {/* Notehead with slanted musical angle */}
    <ellipse cx="895" cy="425" rx="39" ry="25" transform="rotate(-26 895 425)" />
    {/* Note Stem */}
    <rect x="918" y="220" width="9.5" height="205" rx="4.5" />
    {/* Note Flag / Hook */}
    <path d="M927.5 220 C950 255, 982 290, 976 338 C972 355, 955 350, 950 328 C949 292, 936 254, 927.5 236 Z" />
  </g>

  {/* Persian Calligraphy Logo: "چنگ" (Chang) */}
  <g fill="currentColor">
    {/* 1. Top Diagonal Sarkash of "گ" (سرکش بالایی گاف) */}
    <polygon points="562,38 385,150 355,150 532,38" />

    {/* 2. Second Diagonal Sarkash of "گ" (سرکش پایینی گاف) */}
    <polygon points="540,88 392,182 366,182 514,88" />

    {/* 3. Main Body & Diagonal Stem of "گ" */}
    <path d="M504 132 L392 204 C366 220, 345 244, 335 274 L378 290 C388 270, 403 254, 420 242 L522 178 C536 169, 542 154, 536 141 C530 129, 516 125, 504 132 Z" />

    {/* 4. Upper Head & Arch of "چ" (سر چ) */}
    <path d="M665 170 C724 116, 804 140, 809 210 C812 240, 789 270, 754 295 C704 330, 624 345, 544 345 L549 310 C614 310, 684 295, 724 265 C754 243, 764 223, 759 205 C754 165, 705 155, 670 190 Z" />

    {/* 5. Center Dip connecting "ن" to "چ" */}
    <path d="M412 265 C442 245, 482 240, 522 255 C562 270, 602 270, 637 250 C662 235, 687 235, 707 250 L692 280 C677 267, 657 267, 637 280 C592 310, 542 305, 497 285 C467 273, 437 277, 412 293 Z" />

    {/* Center Dot of "ن" (نقطه نون - دایره تک متقارن) */}
    <circle cx="568" cy="202" r="31" />

    {/* Three Dots of "چ" (سه نقطه چنگ در پایین راست) */}
    <circle cx="704" cy="378" r="27" />
    <circle cx="768" cy="348" r="27" />
    <circle cx="803" cy="408" r="27" />

    {/* Three Smooth Parallel Base Contour Ribbons (سه موج موازی زیر کلمه) */}
    {/* Ribbon 1 (Top contour) */}
    <path d="M224 275 C229 335, 279 395, 379 400 C469 405, 544 370, 619 345 C689 323, 759 330, 819 370 L834 343 C764 297, 679 290, 604 313 C534 335, 464 367, 384 363 C299 357, 259 310, 254 275 Z" />

    {/* Ribbon 2 (Middle contour) */}
    <path d="M219 315 C224 375, 274 430, 374 435 C459 439, 534 407, 609 383 C674 363, 739 370, 794 405 L809 378 C744 337, 664 330, 594 353 C524 375, 454 405, 379 400 C294 395, 254 350, 249 315 Z" />

    {/* Ribbon 3 (Bottom contour) */}
    <path d="M214 355 C219 413, 269 465, 369 470 C449 473, 524 443, 599 420 C659 403, 719 410, 769 443 L784 415 C724 377, 649 370, 584 393 C514 415, 444 443, 374 437 C289 431, 249 387, 244 355 Z" />
  </g>
</svg>
